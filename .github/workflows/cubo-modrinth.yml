name: Aplicar catalogo Modrinth de Cubo
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cubo-catalogo
  cancel-in-progress: false
jobs:
  aplicar:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3_openjdk
      - name: Comprobar y aplicar fuentes
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64,hashlib,io,pathlib,zipfile
          root=pathlib.Path.cwd()
          checks={"app_mojo/src/main/java/git/artdeell/mojo/fragments/MainMenuFragment.java": ["8e67c4027001c95b6adf005b6bdf3b7a9ff2ee285c53207821b5c6b8e1061530", "d44c24bda2d0a94d16891e234f30838a36ca035ec0f5cf815f881fd736619691"], "app_mojo/src/main/java/git/artdeell/mojo/fragments/CuboModrinthFragment.java": ["ABSENT", "43e8652ecc02b950c87315a5c953f4ac2f20aecec9af8b742c24c0e7268edd49"], "app_mojo/src/main/java/git/artdeell/mojo/modding/cubo/CuboModrinth.java": ["ABSENT", "aebd0fd639bfb3bc401ed287333bd0b699cc6caabb67257f96f23179a2d2a945"]}
          for name,allowed in checks.items():
              f=root/name
              actual=hashlib.sha256(f.read_bytes()).hexdigest() if f.exists() else 'ABSENT'
              if actual not in allowed:
                  raise RuntimeError('Se cancela para no sobrescribir cambios posteriores: '+name)
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(''))) as archive:
              if set(archive.namelist()) != set(checks):
                  raise RuntimeError('Contenido inesperado')
              for name in archive.namelist():
                  f=root/name
                  f.parent.mkdir(parents=True,exist_ok=True)
                  f.write_bytes(archive.read(name))
                  print('Aplicado:',name)
          PYCODE
      - name: Guardar cambios
        shell: bash
        run: |
          git config user.name "Cubo updater"
          git config user.email "cubo-ui@users.noreply.github.com"
          git add app_mojo/src/main/java/git/artdeell/mojo/fragments/MainMenuFragment.java app_mojo/src/main/java/git/artdeell/mojo/fragments/CuboModrinthFragment.java app_mojo/src/main/java/git/artdeell/mojo/modding/cubo/CuboModrinth.java
          if ! git diff --cached --quiet; then
            git commit -m "Agregar catalogo paginado de Modrinth e instalador de dependencias beta"
            git push origin HEAD:v3_openjdk
          fi
      - name: Proximo paso
        run: echo "Ejecuta Android CI manualmente; este flujo aplica codigo, no genera la APK."
