name: Aplicar mejoras de registros durante el juego
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3_openjdk
      - name: Verificar y aplicar cambios
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, hashlib, io, pathlib, zipfile
          root=pathlib.Path.cwd()
          checks={"app_mojo/src/main/java/com/kdt/LoggerView.java": ["9b491b5c611d6f475ed7f18eaec1bc9d9af4ed38ae20cd7bdf34f047b6169783", "9191ad0daf15acac6db54c52fdd51abce9134b07473c42b03b368ca13ed5b554"], "app_mojo/src/main/java/git/artdeell/mojo/utils/JREUtils.java": ["fb1c3548c4a5dd225bc86269c27f5ceabcd247cd48b1f897bd4ba97087b8525b", "fb729b46ab116d3436c54db746c8ae9e860a8d479faa77b195e63b424c22f93c"]}
          for name,allowed in checks.items():
              if hashlib.sha256((root/name).read_bytes()).hexdigest() not in allowed:
                  raise RuntimeError('El archivo ha cambiado; se cancela para no sobrescribir cambios: '+name)
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(''))) as archive:
              if set(archive.namelist()) != set(checks):
                  raise RuntimeError('Contenido inesperado')
              for name in archive.namelist():
                  (root/name).write_bytes(archive.read(name))
                  print('Aplicado:',name)
          PYCODE
      - name: Guardar codigo
        run: |
          git config user.name "Cubo updater"
          git config user.email "cubo-ui@users.noreply.github.com"
          git add app_mojo/src/main/java/com/kdt/LoggerView.java app_mojo/src/main/java/git/artdeell/mojo/utils/JREUtils.java
          if ! git diff --cached --quiet; then
            git commit -m "Limitar consola en vivo y reducir trabajo de registros"
            git push origin HEAD:v3_openjdk
          fi
      - name: Continuar
        run: echo "Ejecuta Android CI manualmente para compilar y probar."
