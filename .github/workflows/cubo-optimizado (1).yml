name: Instalar perfil Cubo Optimizado 1.20.1 beta
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cubo-perfil
  cancel-in-progress: false
jobs:
  aplicar:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3_openjdk
      - name: Aplicar archivos de interfaz
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, io, pathlib, zipfile
          data = ""
          root = pathlib.Path.cwd()
          import hashlib
          source = root / "app_mojo/src/main/java/git/artdeell/mojo/fragments/MainMenuFragment.java"
          before = hashlib.sha256(source.read_bytes()).hexdigest()
          if before not in ["6fffc81962619e61f9d72be488e2a52c71ead7ff52e556f73eca5d9307ae3168", "8e67c4027001c95b6adf005b6bdf3b7a9ff2ee285c53207821b5c6b8e1061530"]:
              raise RuntimeError("El archivo cambio desde la revision. No se sobrescribira; pide actualizar el parche.")
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(data))) as archive:
              for entry in archive.infolist():
                  relative = pathlib.PurePosixPath(entry.filename)
                  if relative.is_absolute() or '..' in relative.parts or not entry.filename.startswith('app_mojo/src/main/'):
                      raise RuntimeError('Ruta de archivo no permitida')
                  target = root / entry.filename
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(entry))
                  print('Aplicado:', entry.filename)
          PYCODE
      - name: Guardar cambios en el repositorio
        shell: bash
        run: |
          git config user.name "Cubo performance updater"
          git config user.email "cubo-ui@users.noreply.github.com"
          git add app_mojo/src/main/
          if git diff --cached --quiet; then
            echo "La mejora ya estaba aplicada."
          else
            git commit -m "Agregar instalador opt-in de perfil optimizado 1.20.1"
            git push origin HEAD:v3_openjdk
          fi
      - name: Siguiente paso
        run: echo "Ahora ejecuta Android CI manualmente en la rama v3_openjdk. Este flujo aplica el codigo, no compila la APK."
